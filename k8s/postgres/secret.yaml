    ('provider1@demo.dev', '$2a$10$N.zmdr9k7uOCQb376NoUnuTJ8iAt6Z5EHsM8lE9lBOsl7iKTVEFDa', 'PROVIDER', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
