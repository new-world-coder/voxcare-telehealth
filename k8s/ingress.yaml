apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voxcare-ingress
  namespace: voxcare
  labels:
    app: voxcare-telehealth
    component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - voxcare.yourdomain.com
    secretName: voxcare-tls
  rules:
  - host: voxcare.yourdomain.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
      - path: /staff
        pathType: Prefix
        backend:
          service:
            name: staff-portal
            port:
              number: 3000
      - path: /patient
        pathType: Prefix
        backend:
          service:
            name: patient-portal
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: staff-portal
            port:
              number: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
