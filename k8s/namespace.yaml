apiVersion: v1
kind: Namespace
metadata:
  name: voxcare
  labels:
    name: voxcare
    app: voxcare-telehealth
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: voxcare-quota
  namespace: voxcare
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "10"
    services: "20"
    pods: "50"
