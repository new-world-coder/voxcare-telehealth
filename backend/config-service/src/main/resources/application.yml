spring:
  application:
    name: config-service
  profiles:
    active: local
  cloud:
    config:
      server:
        git:
          uri: https://github.com/your-username/pulsecare-config
          default-label: main
          search-paths: config
          clone-on-start: true
          timeout: 10

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.config: DEBUG
