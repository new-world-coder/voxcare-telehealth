spring:
  application:
    name: default-config
  datasource:
    url: jdbc:postgresql://postgres:5432/voxcare
    username: voxcare
    password: voxcare123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    mongodb:
      uri: mongodb://voxcare:voxcare123@mongo:27017/voxcare?authSource=admin

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    hostname: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.voxcare: DEBUG
    org.springframework.cloud: INFO
