spring:
  data:
    mongodb:
      uri: mongodb://voxcare:voxcare123@mongo:27017/voxcare?authSource=admin
  server:
    port: 8085
  application:
    name: telehealth-service

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    hostname: telehealth-service
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

jitsi:
  base-url: https://meet.jit.si

logging:
  level:
    com.voxcare.telehealth: DEBUG
    org.springframework.web: INFO
