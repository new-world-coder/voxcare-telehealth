spring:
  application:
    name: voice-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:voxcare}
    username: ${POSTGRES_USER:voxcare}
    password: ${POSTGRES_PASSWORD:voxcare123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${VOICE_SERVICE_PORT:8087}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

voxcare:
  voice:
    provider: ${VOICE_PROVIDER:mock}
    dial-api-key: ${DIAL_API_KEY:}
    dial-base-url: ${DIAL_BASE_URL:https://api.getdial.ai}
    dial-from-number-id: ${DIAL_FROM_NUMBER_ID:}
    dial-webhook-secret: ${DIAL_WEBHOOK_SECRET:}
    max-retries: ${VOICE_MAX_RETRIES:3}
    retry-delay-minutes: ${VOICE_RETRY_DELAY_MINUTES:30}
    sms-fallback-enabled: ${VOICE_SMS_FALLBACK_ENABLED:true}
    default-clinic-name: ${VOICE_DEFAULT_CLINIC_NAME:VoxCare}
    patient-service-base-url: ${PATIENT_SERVICE_BASE_URL:http://localhost:8082}

logging:
  level:
    com.voxcare: DEBUG
