server:
  port: 8086

spring:
  application:
    name: notification-service
  
  data:
    mongodb:
      uri: mongodb://localhost:27017/pulsecare
      database: pulsecare
  
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.pulsecare: DEBUG
    org.springframework.cloud: INFO
    org.springframework.data.mongodb: DEBUG

sendgrid:
  enabled: false
  api-key: your-sendgrid-api-key

---
spring:
  config:
    activate:
      on-profile: docker
  
  data:
    mongodb:
      uri: mongodb://pulsecare:pulsecare123@mongo:27017/pulsecare?authSource=admin

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    hostname: notification-service

spring:
  cloud:
    config:
      uri: http://config-service:8888
