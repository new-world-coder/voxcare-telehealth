global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8081']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s

  - job_name: 'patient-service'
    static_configs:
      - targets: ['patient-service:8082']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s

  - job_name: 'provider-service'
    static_configs:
      - targets: ['provider-service:8083']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s

  - job_name: 'appointment-service'
    static_configs:
      - targets: ['appointment-service:8084']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s

  - job_name: 'telehealth-service'
    static_configs:
      - targets: ['telehealth-service:8085']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:8086']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s

  - job_name: 'discovery-service'
    static_configs:
      - targets: ['discovery-service:8761']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s

  - job_name: 'config-service'
    static_configs:
      - targets: ['config-service:8888']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
